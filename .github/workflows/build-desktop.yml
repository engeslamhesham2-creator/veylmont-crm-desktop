name: Build & release desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release build at a time — overlapping tag pushes must not race on the
# same GitHub release.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # On a tag push -> build AND publish to GitHub Releases (generates the
      # latest.yml / latest-mac.yml feed that electron-updater reads).
      # On manual run -> build only, upload as artifacts.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: veylmont-crm-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          if-no-files-found: ignore
